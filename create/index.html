<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1Shot Wallet — Create account</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #fafafa;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 1rem 2rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .subtitle {
        margin: 0 0 1rem;
        opacity: 0.7;
        font-size: 0.9rem;
        text-align: center;
        max-width: 28rem;
      }
      #wallet-container {
        width: min(100%, 360px);
        height: min(70vh, 600px);
        flex: 0 0 auto;
        position: relative;
      }
      #status {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.85;
        text-align: center;
        max-width: 28rem;
      }
      #status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Create your wallet</h1>
      <p class="subtitle">
        Complete passkey setup in this tab. It will close automatically when
        you finish.
      </p>
      <div id="wallet-container"></div>
      <p id="status" aria-live="polite">Starting…</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
