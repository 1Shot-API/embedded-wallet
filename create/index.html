<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1Shot Wallet — Create account</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        /* Must match create/createHostConstants.ts; overridden at load by applyMountSizeVars(). */
        --create-wallet-size-x: 420px;
        --create-wallet-size-y: 600px;
        --create-wallet-size-y-max: calc(100dvh - 11rem);
        --create-wallet-mount-min-height: 480px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fafafa;
        color: #0a0a0a;
      }
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 1rem 2rem;
      }
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 0.35rem;
      }
      .header img {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        text-align: center;
      }
      .subtitle {
        margin: 0 0 1rem;
        color: #525252;
        font-size: 0.9rem;
        text-align: center;
        max-width: 28rem;
      }
      /* Inline OWSProxy fills this mount (absolute inset 0) — keep modal size. */
      .wallet-mount {
        position: relative;
        width: min(var(--create-wallet-size-x), 100%);
        height: min(var(--create-wallet-size-y), var(--create-wallet-size-y-max));
        min-height: min(
          var(--create-wallet-mount-min-height),
          var(--create-wallet-size-y-max)
        );
        flex: 0 0 auto;
        border-radius: 12px;
        overflow: hidden;
        box-shadow:
          0 1px 2px rgb(0 0 0 / 6%),
          0 8px 24px rgb(0 0 0 / 8%);
        background: #fff;
      }
      #wallet-container {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      #wallet-skeleton {
        position: absolute;
        inset: 0;
        z-index: 0;
        padding: 1.25rem 1.25rem 1rem;
        display: flex;
        flex-direction: column;
        background: #fff;
        pointer-events: none;
      }
      #wallet-skeleton .sk-title {
        height: 1.25rem;
        width: 55%;
        border-radius: 0.375rem;
        background: #f5f5f5;
      }
      #wallet-skeleton .sk-body {
        margin-top: 0.75rem;
        height: 3.5rem;
        width: 100%;
        border-radius: 0.375rem;
        background: #f5f5f5;
      }
      #wallet-skeleton .sk-label {
        margin-top: 1.25rem;
        height: 0.875rem;
        width: 28%;
        border-radius: 0.25rem;
        background: #f5f5f5;
      }
      #wallet-skeleton .sk-field {
        margin-top: 0.375rem;
        height: 2.5rem;
        width: 100%;
        border-radius: 0.5rem;
        background: #f5f5f5;
      }
      #wallet-skeleton .sk-actions {
        margin-top: auto;
        display: flex;
        flex-direction: column-reverse;
        gap: 0.5rem;
        padding-bottom: 0.25rem;
      }
      #wallet-skeleton .sk-btn {
        height: 2.75rem;
        width: 100%;
        border-radius: 0.5rem;
        background: #f5f5f5;
      }
      #wallet-skeleton .sk-btn-primary {
        background: #e8e8e8;
      }
      #status {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #404040;
        text-align: center;
        max-width: 28rem;
      }
      #status[hidden] {
        display: none;
      }
      #status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <img
          src="../src/assets/1Shot-Icon-New.svg"
          alt=""
          width="40"
          height="40"
        />
        <h1>Create your wallet</h1>
      </div>
      <p class="subtitle">
        This tab closes automatically when you finish.
      </p>
      <div class="wallet-mount">
        <div id="wallet-skeleton" aria-hidden="true">
          <div class="sk-title"></div>
          <div class="sk-body"></div>
          <div class="sk-label"></div>
          <div class="sk-field"></div>
          <div class="sk-actions">
            <div class="sk-btn"></div>
            <div class="sk-btn sk-btn-primary"></div>
          </div>
        </div>
        <div id="wallet-container"></div>
      </div>
      <p id="status" aria-live="polite">Starting…</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
