server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep Location headers relative so published host ports (e.g. :8080) survive redirects.
    absolute_redirect off;

    # Signing Layer — unbundled ES modules (same origin as branding)
    location /signer/ {
        try_files $uri $uri/ /signer/index.html;
    }

    location = /signer {
        return 301 /signer/;
    }

    # Branding Layer — Vite SPA under /wallet/
    location /wallet/ {
        try_files $uri $uri/ /wallet/index.html;
    }

    location = /wallet {
        return 301 /wallet/;
    }

    location = / {
        return 302 /wallet/;
    }
}
