<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="1Shot Wallet" />
    <link rel="manifest" href="/mobile/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mobile/icons/icon-192.png" />
    <title>1Shot Wallet</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #a3a3a3;
        --border: #262626;
        --accent: #3d8bfd;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
      }
      #app {
        height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .chrome {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.65rem 0.75rem;
        padding-top: max(0.65rem, env(safe-area-inset-top));
        border-bottom: 1px solid var(--border);
        background: #111;
      }
      .chrome-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .chrome h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        flex: 1;
      }
      #status {
        margin: 0;
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.3;
      }
      #status.error {
        color: var(--danger);
      }
      #uri-input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #171717;
        color: var(--fg);
        padding: 0.45rem 0.6rem;
        font-size: 0.8rem;
      }
      #pair-btn {
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
      }
      #pair-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .wallet-mount {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        background: #fff;
      }
      #wallet-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div class="chrome-row">
          <h1>1Shot Wallet</h1>
        </div>
        <p id="status" aria-live="polite">Starting…</p>
        <div class="chrome-row">
          <input
            id="uri-input"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="Paste wc: URI"
            aria-label="WalletConnect URI"
          />
          <button id="pair-btn" type="button">Pair</button>
        </div>
      </header>
      <div class="wallet-mount">
        <div id="wallet-container"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
